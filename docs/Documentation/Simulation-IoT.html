<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation pédagogique — Alerte fumée</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:0;padding:24px}
main{max-width:760px;margin:auto}
.card{background:white;border-radius:12px;padding:22px;margin:16px 0;box-shadow:0 2px 10px #0001}
.value{font-size:44px;font-weight:bold;margin:12px 0}
.status{padding:12px;border-radius:8px;font-weight:bold}
.normal{background:#dcfce7;color:#166534}.alert{background:#fee2e2;color:#991b1b}
button{padding:10px 16px;border:0;border-radius:8px;background:#1d4ed8;color:white;cursor:pointer}
input{padding:9px;width:100px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd}
small{color:#64748b}
</style>
</head>
<body>
<main>
<h1>Simulation pédagogique — Détection de fumée</h1>
<p>Exemple fictif pour le TP Wiki collaboratif. Aucune donnée réelle de capteur n'est utilisée.</p>
<section class="card">
<label>Seuil pédagogique : <input id="threshold" type="number" value="700" min="0" max="1000"></label>
<div class="value" id="value">—</div>
<div id="status" class="status normal">En attente d'une simulation</div>
<p><button id="generate">Générer une mesure</button></p>
<small>Les valeurs générées sont aléatoires entre 0 et 1000.</small>
</section>
<section class="card">
<h2>Historique simulé</h2>
<table><thead><tr><th>#</th><th>Valeur</th><th>État</th></tr></thead><tbody id="history"></tbody></table>
</section>
</main>
<script>
let count=0;
const valueEl=document.getElementById('value');
const statusEl=document.getElementById('status');
const thresholdEl=document.getElementById('threshold');
const historyEl=document.getElementById('history');
let lastValue=null;
function render(){
 if(lastValue===null)return;
 const isAlert=lastValue>=Number(thresholdEl.value);
 statusEl.textContent=isAlert?'ALERTE — seuil dépassé':'NORMAL — sous le seuil';
 statusEl.className='status '+(isAlert?'alert':'normal');
}
document.getElementById('generate').addEventListener('click',()=>{
 lastValue=Math.floor(Math.random()*1001);
 count++;
 valueEl.textContent=lastValue;
 render();
 const row=document.createElement('tr');
 const cells=[count,lastValue,lastValue>=Number(thresholdEl.value)?'Alerte':'Normal'];
 cells.forEach(v=>{const td=document.createElement('td');td.textContent=v;row.appendChild(td);});
 historyEl.prepend(row);
});
thresholdEl.addEventListener('input',render);
</script>
</body>
</html>
